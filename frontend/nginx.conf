server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve "app" em tempo de requisição (resolver do Docker), não só ao iniciar: se o app
    # reiniciar ou ainda não existir quando o nginx sobe, o nginx sobe do mesmo jeito.
    resolver 127.0.0.11 valid=10s;

    # Repassa pro backend, com os cabeçalhos que ele precisa (server.forward-headers-strategy=native)
    # pra montar URL e cookie certos atrás do proxy. Sem cabeçalho de segurança do front aqui: a
    # API já define os próprios (SecurityConfig).
    location /api/ {
        set $app_upstream app:8080;
        proxy_pass http://$app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # O Vite coloca hash no nome de tudo em /assets: pode cachear por muito tempo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    }

    # SPA: tudo que não é arquivo estático cai no index.html, o React Router decide a rota.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
