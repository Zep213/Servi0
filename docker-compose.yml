services:
  db:
    image: postgres:17
    container_name: servio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servio}
      POSTGRES_USER: ${POSTGRES_USER:-servio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servio}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - servio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servio} -d ${POSTGRES_DB:-servio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: servio-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  app:
    build: .
    container_name: servio-app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-servio}
      DB_USER: ${POSTGRES_USER:-servio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-servio}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SERVIO_ADMIN_EMAIL: ${SERVIO_ADMIN_EMAIL:-}
      SERVIO_ADMIN_SENHA: ${SERVIO_ADMIN_SENHA:-}
      SERVIO_ADMIN_NOME: ${SERVIO_ADMIN_NOME:-Administrador}
      SERVIO_PAROQUIA_NOME: ${SERVIO_PAROQUIA_NOME:-Paróquia Inicial}
      SERVIO_FRONT_URL: ${SERVIO_FRONT_URL:-http://localhost}
      SERVIO_FUSO: ${SERVIO_FUSO:-America/Fortaleza}
      SERVIO_JOBS_ENABLED: ${SERVIO_JOBS_ENABLED:-true}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-false}
      SERVIO_MAIL_FROM: ${SERVIO_MAIL_FROM:-Servio <no-reply@servio.local>}

  web:
    build: ./frontend
    container_name: servio-web
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-80}:8080"

volumes:
  servio-db-data:
