services:
  db:
    image: postgres:17
    container_name: servio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servio}
      POSTGRES_USER: ${POSTGRES_USER:-servio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servio}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - servio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servio} -d ${POSTGRES_DB:-servio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: servio-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-servio}
      DB_USER: ${POSTGRES_USER:-servio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-servio}
      SERVIO_ADMIN_EMAIL: ${SERVIO_ADMIN_EMAIL:-}
      SERVIO_ADMIN_SENHA: ${SERVIO_ADMIN_SENHA:-}
      SERVIO_ADMIN_NOME: ${SERVIO_ADMIN_NOME:-Administrador}
      SERVIO_PAROQUIA_NOME: ${SERVIO_PAROQUIA_NOME:-Paróquia Inicial}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  servio-db-data:
