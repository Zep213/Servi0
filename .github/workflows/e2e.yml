name: E2E

# Manual só: sobe o docker compose inteiro (db descartável, mailpit, app, web) e manda e-mail de
# verdade pro Mailpit, então não roda a cada push — só quando alguém pedir.
on:
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      SERVIO_ADMIN_EMAIL: admin@e2e.local
      SERVIO_ADMIN_SENHA: senha-e2e-${{ github.run_id }}
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Subir a stack (db descartável, mailpit, app, web)
        run: docker compose up -d --build

      - name: Esperar o app responder
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost/api/auth/csrf > /dev/null && exit 0
            sleep 2
          done
          echo "O app não respondeu a tempo"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do front
        working-directory: frontend
        run: npm ci

      - name: Instalar o navegador do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes de ponta a ponta
        working-directory: frontend
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost
          MAILPIT_URL: http://localhost:8025

      - name: Guardar o relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
