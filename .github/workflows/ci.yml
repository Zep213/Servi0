name: CI
# push só na main: nas branches de feature o run do pull_request já cobre o mesmo SHA.
on:
  push:
    branches: [main]
  pull_request:

# Na main o grupo leva o run_id: cada push roda até o fim, sem um run pendente substituir o outro.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Procurar senhas e chaves commitadas
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25', cache: maven }

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Build da imagem
        run: docker build -t servio:ci .

      - name: Scan da imagem
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: servio:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version-file: 'frontend/.nvmrc', cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test -- --run

      - name: Build
        run: npm run build
