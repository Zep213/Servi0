spring.application.name=Servio

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servio}
spring.datasource.username=${DB_USER:servio}
spring.datasource.password=${DB_PASSWORD:servio}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Primeiro acesso: cria paróquia + ADMIN se não houver nenhum usuário
servio.bootstrap.admin-email=${SERVIO_ADMIN_EMAIL:}
servio.bootstrap.admin-senha=${SERVIO_ADMIN_SENHA:}
servio.bootstrap.admin-nome=${SERVIO_ADMIN_NOME:Administrador}
servio.bootstrap.paroquia-nome=${SERVIO_PAROQUIA_NOME:Paróquia Inicial}

# Contas de demonstração: veem mas nenhuma escrita é aceita (SomenteLeituraFilter).
# Opcionais — só são criadas se o par EMAIL/SENHA correspondente estiver preenchido.
servio.demo.email=${SERVIO_DEMO_EMAIL:}
servio.demo.senha=${SERVIO_DEMO_SENHA:}
servio.demo.nome=${SERVIO_DEMO_NOME:Visitante (somente leitura)}

# Mesma ideia, mas perfil SERVIDOR (visão de membro, não de ADMIN).
servio.demo-membro.email=${SERVIO_DEMO_MEMBRO_EMAIL:}
servio.demo-membro.senha=${SERVIO_DEMO_MEMBRO_SENHA:}
servio.demo-membro.nome=${SERVIO_DEMO_MEMBRO_NOME:Visitante Membro (somente leitura)}

# ---------- Sessão ----------
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
# duração por cargo (aplicada no login); o cookie usa o maior dos dois
servio.sessao.membro-dias=60
servio.sessao.gestao-dias=7
spring.session.jdbc.cleanup-cron=0 */15 * * * *

server.servlet.session.cookie.name=SERVIO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# IP real do cliente atrás do nginx (essencial para o rate limit do login)
server.forward-headers-strategy=native

# Não vazar detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never

# Campos a mais no JSON viram 400 em vez de serem ignorados (anti mass assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true

# ---------- Etapa 6: sorteio, escalação e convite por e-mail ----------
servio.fuso=${SERVIO_FUSO:America/Fortaleza}
servio.front-url=${SERVIO_FRONT_URL:http://localhost:5173}
servio.jobs.enabled=${SERVIO_JOBS_ENABLED:true}

# ---------- Sprint 2: token de conta (ativação, recuperação, proteção) ----------
servio.conta.ativacao-dias=7
servio.conta.recuperacao-minutos=60
servio.conta.protecao-dias=7
servio.conta.limite-por-minuto=20
servio.conta.cadastro-membro-por-hora=20

# E-mail (SMTP). Em dev, o docker-compose sobe o Mailpit (SMTP 1025, painel em 8025).
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
servio.mail.from=${SERVIO_MAIL_FROM:Servio <no-reply@servio.local>}

# ---------- OpenAPI (Swagger UI) ----------
# Ligado só por variável: em desenvolvimento OPENAPI_ENABLED=true; em produção, desligado.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.default-flat-param-object=true
