spring.application.name=Servio

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servio}
spring.datasource.username=${DB_USER:servio}
spring.datasource.password=${DB_PASSWORD:servio}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Primeiro acesso: cria paróquia + ADMIN se não houver nenhum usuário
servio.bootstrap.admin-email=${SERVIO_ADMIN_EMAIL:}
servio.bootstrap.admin-senha=${SERVIO_ADMIN_SENHA:}
servio.bootstrap.admin-nome=${SERVIO_ADMIN_NOME:Administrador}
servio.bootstrap.paroquia-nome=${SERVIO_PAROQUIA_NOME:Paróquia Inicial}

# ---------- Sessão ----------
spring.session.jdbc.initialize-schema=never
spring.session.timeout=7d
spring.session.jdbc.cleanup-cron=0 */15 * * * *

server.servlet.session.cookie.name=SERVIO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

# IP real do cliente atrás do nginx (essencial para o rate limit do login)
server.forward-headers-strategy=native

# Não vazar detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never

# Campos a mais no JSON viram 400 em vez de serem ignorados (anti mass assignment)
spring.jackson.deserialization.fail-on-unknown-properties=true
