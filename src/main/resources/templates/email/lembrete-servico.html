<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${assunto}">Servio</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
    <tr><td align="center" style="padding:16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;">
        <tr><td style="padding:24px;font-size:17px;line-height:1.5;">
          <p style="margin:0 0 16px;">Olá, <strong th:text="${nome}">Maria</strong>!</p>
          <p style="margin:0 0 16px;">Amanhã você serve em <strong th:text="${titulo}">Missa dominical</strong>:</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;font-size:17px;">
            <tr><td style="padding:4px 12px 4px 0;color:#6b7280;">Data</td><td th:text="${data}">12/10/2026</td></tr>
            <tr><td style="padding:4px 12px 4px 0;color:#6b7280;">Horário da celebração</td><td th:text="${hora}">19:00</td></tr>
            <tr th:if="${chegada != null}"><td style="padding:4px 12px 4px 0;color:#6b7280;">Chegar até</td><td th:text="${chegada}">18:30</td></tr>
            <tr><td style="padding:4px 12px 4px 0;color:#6b7280;">Função</td><td th:text="${funcao}">Leitor</td></tr>
          </table>
          <p th:if="${observacao != null}" style="margin:0 0 16px;background:#f9fafb;border-radius:6px;padding:12px;"><strong>Observação:</strong> <span th:text="${observacao}">Levar a Bíblia</span></p>
          <p style="margin:0;">Obrigado por servir!</p>
        </td></tr>
        <tr><td style="padding:12px 24px 24px;font-size:13px;color:#6b7280;">Servio · esta é uma mensagem automática, não responda.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
